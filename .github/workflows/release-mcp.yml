name: Release MCP server

on:
  push:
    tags: ['mcp-v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the tag matches the server version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./projects/mcp/package.json').version")"
          if [ "$TAG" != "mcp-v$version" ]; then
            echo "::error::Tag $TAG does not match projects/mcp/package.json version mcp-v$version"
            exit 1
          fi

      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: MCP tests
        run: pnpm run test:mcp

      # The library build writes the manifest the server bundles as its snapshot.
      - name: Build library
        run: pnpm run build

      - name: Build MCP server
        run: pnpm run build:mcp

      - name: Ensure npm supports trusted publishing
        run: |
          required="11.5.1"
          current="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            npm install --global npm@latest
          fi
          npm --version

      - name: Publish to npm
        working-directory: dist/mcp
        run: npm publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract the release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v version="${TAG#mcp-v}" '
            $0 == "## " version { found = 1; next }
            /^## / { found = 0 }
            found
          ' projects/mcp/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::No section '## ${TAG#mcp-v}' found in projects/mcp/CHANGELOG.md"
            exit 1
          fi

      # --latest=false keeps the "Latest" badge on the library's own releases.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A GitHub Release for $TAG already exists"
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --latest=false --notes-file "$RUNNER_TEMP/release-notes.md"
